<html lang="it">
<head>

<body class="audio-admin-page" data-screen-protection="always">
  <main class="audio-admin-shell">
    <header class="audio-admin-head">
      <a class="audio-admin-back" href="/" aria-label="Torna alla Home"><img src="icons/home.png" alt="" aria-hidden="true"></a>
      <p>MAGIC BOOK · ADMIN</p>
      <h1>Aggiungi spiegazioni</h1>
      <span id="audioAdminGlobalProgress" class="magic-loading-inline-status is-loading" role="status">Caricamento dei 788 quiz…</span>
    </header>
    <div id="audioAdminMessage" class="audio-admin-message" role="status" aria-live="polite"></div>
    <section id="audioAdminLegacyReview" class="audio-admin-legacy-review hidden" aria-live="polite"></section>
    <section id="audioAdminChapters" class="audio-admin-chapters" aria-label="Capitoli Magic Book"></section>
    <section id="audioAdminQuestions" class="audio-admin-questions hidden" aria-live="polite"></section>
  </main>
  <div class="audio-admin-modal hidden" id="audioAdminDialog" role="dialog" aria-modal="true" aria-labelledby="audioAdminDialogTitle">
    <div class="audio-admin-modal-card">
      <p>MAGIC BOOK</p>
      <h2 id="audioAdminDialogTitle">Conferma</h2>
      <div id="audioAdminDialogText"></div>
      <details id="audioAdminDialogDetails" class="hidden"><summary>Dettaglio per sviluppatore</summary><code id="audioAdminDialogCode"></code></details>
      <div class="audio-admin-dialog-actions">
        <button id="audioAdminDialogCancel" type="button">Annulla</button>
        <button id="audioAdminDialogConfirm" type="button">Continua</button>
      </div>
    </div>
  </div>
  <script src="quiz-audio-identity.js?v=2-live-catalog-reconcile"></script>
  <script src="patenteGlossaryResolver.js?v=1.0.0"></script>
  <script src="patenteContextResolverV3.js?v=4.0.0-glossary-display"></script>
  <script>
    window.QUIZ_HELP_RUNTIME_V3_DEFAULT_ENABLED = true;
    window.QUIZ_HELP_RUNTIME_V3_MANIFEST_URL = "https://www.tmmbooks.eu/dist/patente/quiz-help-runtime-manifest.json";
  </script>
  <script src="quizHelpRuntimeV3Loader.js?v=3.0.2-translation-integrity"></script>
  <script src="quiz-help-preview.js?v=1-personal-bangla-preview"></script>
