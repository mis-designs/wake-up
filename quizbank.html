<!DOCTYPE html>
<html lang="it" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Quiz Bank di MagicBook: una nuova sezione di quiz è in arrivo.">
  <meta name="robots" content="noindex,nofollow,noimageindex">
  <link rel="canonical" href="https://tmmmagic.eu/quizbank">
  <link rel="icon" type="image/png" href="/icons/mg_logo.png">
  <link rel="apple-touch-icon" href="/icons/mg_logo.png">
  <link rel="stylesheet" href="/assets/fonts/magicbook-latin-fonts.css?v=1">
  <link rel="stylesheet" href="/quizbank.css?v=1-coming-soon">
  <title>Quiz Bank | Coming Soon — MagicBook</title>
</head>
<body class="quizbank-page">
  <div class="quizbank-shell">
    <header class="quizbank-header">
      <a class="quizbank-home" href="/" aria-label="Torna alla home di MagicBook">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M3 10.7 12 3l9 7.7v9.1a1.2 1.2 0 0 1-1.2 1.2h-5.1v-6.2H9.3V21H4.2A1.2 1.2 0 0 1 3 19.8z" fill="currentColor"/>
        </svg>
        <span>MagicBook</span>
      </a>
    </header>

    <main class="quizbank-main" aria-labelledby="quizbank-title">
      <div class="quizbank-art" aria-hidden="true">
        <span class="quizbank-orbit"></span>
        <span class="quizbank-spark quizbank-spark--one"></span>
        <span class="quizbank-spark quizbank-spark--two"></span>
        <div class="quizbank-stack">
          <span class="quizbank-card quizbank-card--back"></span>
          <span class="quizbank-card quizbank-card--middle"></span>
          <span class="quizbank-card quizbank-card--front">
            <span class="quizbank-card-kicker">QUIZ</span>
            <span class="quizbank-question">?</span>
            <span class="quizbank-answer-lines"><i></i><i></i></span>
            <span class="quizbank-check"><svg viewBox="0 0 20 20" focusable="false"><path d="m5 10.5 3.1 3.1L15.5 6"/></svg></span>
          </span>
        </div>
        <span class="quizbank-shadow"></span>
      </div>

      <p class="quizbank-kicker">QUIZ BANK</p>
      <h1 id="quizbank-title">Coming Soon</h1>
      <p class="quizbank-copy">La nuova raccolta di quiz sarà disponibile qui a breve.</p>
      <a class="quizbank-return" href="/">Torna a MagicBook</a>
    </main>
  </div>
</body>
</html>
