<!DOCTYPE html>
<html lang="it" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="robots" content="noindex,nofollow,noimageindex">
  <title>MagicBook | Studia quiz</title>
  <link rel="icon" type="image/png" href="/api/asset?name=mg_logo">
  <link rel="apple-touch-icon" href="/api/asset?name=mg_logo">
  <link rel="manifest" href="manifest.webmanifest?v=16">
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/hadi-rounded/hadi-rounded-regular.woff2?v=1" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/assets/fonts/adorsho-lipi/adorsho-lipi-regular.woff2?v=1" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/fonts/magicbook-bangla-fonts.css?v=1-adorsho">
  <link rel="stylesheet" href="study-quiz.css?v=23-adorsho-study-text">
  <link rel="stylesheet" href="magic-dictionary.css?v=1.2.2">
  <link rel="stylesheet" href="screen-protection.css?v=1.1.0">
</head>
<body data-screen-protection="always">
  <header class="study-header">
    <button id="study-back" class="study-icon-button" type="button" aria-label="Indietro">
      <img src="icons/go-back.png" alt="">
    </button>
    <div class="study-heading">
      <small>MAGICBOOK</small>
      <h1 id="study-title">Studia quiz</h1>
      <p id="study-subtitle">Scegli un capitolo e studia tutte le domande.</p>
    </div>
    <a class="study-practice-link" href="/quiz">Fai quiz <img class="study-system-arrow" src="icons/next.png" alt=""></a>
  </header>

  <main class="study-main">
    <section id="study-chapters" aria-labelledby="study-chapters-title">
      <div class="study-intro">
        <div class="study-intro-copy" lang="bn">
          <h2 id="study-chapters-title">আজকে কোন অধ্যায়টি পড়তে চাচ্ছেন ?</h2>
          <p id="study-last-chapter" class="hidden" aria-live="polite"></p>
        </div>
      </div>
      <div id="study-chapter-grid" class="study-chapter-grid"></div>
    </section>

    <section id="study-reader" class="hidden" aria-labelledby="study-reader-title">
      <div class="study-reader-toolbar">
        <div>
          <span id="study-reader-kicker">CAPITOLO</span>
          <h2 id="study-reader-title">Domande</h2>
          <p id="study-question-count" aria-live="polite"></p>
        </div>
        <label class="study-search">
          <span class="sr-only">Cerca nelle domande</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
          <input id="study-search-input" type="search" placeholder="Cerca una parola…" autocomplete="off">
        </label>
      </div>
      <div id="study-question-list" class="study-question-list"></div>
      <p id="study-empty-search" class="study-empty hidden">Nessuna domanda contiene questa parola.</p>
    </section>

    <section id="study-loading" class="study-loading hidden" aria-live="polite">
      <div class="study-loader" aria-hidden="true">
        <img src="icons/driving-license.gif" alt="" decoding="async">
      </div>
      <strong>Carico tutte le domande del capitolo…</strong>
      <span>Un momento</span>
    </section>

    <section id="study-error" class="study-error hidden" role="alert">
      <strong>Non è stato possibile caricare le domande.</strong>
      <p id="study-error-message">Riprova tra poco.</p>
      <button id="study-retry" type="button">Riprova</button>
    </section>
  </main>

  <div id="study-toast" class="study-toast" aria-live="polite"></div>

  <script src="patenteGlossaryResolver.js?v=1.0.0"></script>
  <script src="patenteContextResolverV3.js?v=4.0.0-glossary-display"></script>
  <script>
    window.QUIZ_HELP_RUNTIME_V3_DEFAULT_ENABLED = true;
    window.QUIZ_HELP_RUNTIME_V3_MANIFEST_URL = "https://www.tmmbooks.eu/dist/patente/quiz-help-runtime-manifest.json";
  </script>
  <script src="quizHelpRuntimeV3Loader.js?v=3.0.2-translation-integrity"></script>
  <script src="magic-dictionary.js?v=1.2.4"></script>
  <script src="quiz-audio-identity.js?v=2"></script>
  <script src="screen-protection.js?v=1.2.0"></script>
  <script src="learning-sync.js?v=2"></script>
  <script src="study-quiz.js?v=16-explanation-artwork"></script>
</body>
</html>
